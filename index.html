<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Blockflow: a concept case study and clickable prototype for planning, making and pricing AI campaigns as visible flows of building blocks.">
<title>Blockflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
/* Layout: a quiet design-tool canvas. White panels hold the work, colour lives only in the flowers.
   One accent (ink) for the primary action and for progress. Type: one display (hero only), one heading, one body, one caption. */
:root{
  --canvas:#EDEDEB; --canvas-glass:rgba(237,237,235,0.9);
  --panel:#FFFFFF; --field:#F4F4F2; --field-2:#E9E9E6;
  --line:#E2E2DE; --line-2:#CDCDC8;
  --ink:#1B1B1A; --ink-2:#55554F; --ink-3:#6E6E68;
  --accent-top:#323232; --accent-bot:#222222; --accent-ring:#333333; --accent-deep:#121212; --on-accent:#FFFFFF;
  --mask:rgba(27,27,26,0.42); --viewer:rgba(237,237,235,0.985);
  --shadow-1:0 1px 2px rgba(0,0,0,0.05);
  --shadow-2:0 1px 2px rgba(0,0,0,0.05), 0 16px 40px rgba(0,0,0,0.10);
  --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Inter Tight", "Inter", system-ui, -apple-system, sans-serif;
  --fs-display:clamp(40px, 6vw, 64px); --fs-h:22px; --fs-body:16px; --fs-cap:13px;
  --r:16px; --r-ctl:12px; --tap:44px;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:var(--fs-body)/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:var(--fs-cap);color:var(--ink-2);line-height:1.4}
.h{font-size:var(--fs-h);font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin:0}
.eyebrow{font-size:var(--fs-cap);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}

/* buttons: primary = the one accent, secondary = quiet panel, ghost = text */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:var(--fs-body);white-space:nowrap;color:var(--ink);text-decoration:none;transition:transform .08s ease, background .15s ease}
.btn:hover{background:var(--field)}
.btn:active{transform:translateY(1px)}
.btn-primary{border:none;color:var(--on-accent);background:linear-gradient(180deg,var(--accent-top) 0%,var(--accent-bot) 100%);box-shadow:inset 0 .5px 1px rgba(255,255,255,.15), inset 0 -1px 1.2px .35px var(--accent-deep), 0 2px 4px -1px rgba(13,13,13,.5), 0 0 0 1px var(--accent-ring)}
.btn-primary:hover{background:linear-gradient(180deg,var(--accent-top) 0%,var(--accent-top) 100%)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--field)}
.btn-lg{min-height:52px;padding:0 24px;border-radius:14px}
.btn-icon{width:var(--tap);padding:0}
.btn-wide{width:100%}
.btn-quiet{background:var(--field);border-color:transparent;color:var(--ink-2)}
.btn:disabled{opacity:1;background:var(--field);color:var(--ink-3);border:1px dashed var(--line-2);box-shadow:none;transform:none}
.linkbtn{background:none;border:none;padding:0 4px;min-height:var(--tap);font-size:var(--fs-cap);font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* top bar: brand, two links, settings. No numbers here. */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--canvas-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:8px 16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-0.02em;color:var(--ink);text-decoration:none;min-height:var(--tap)}
.mark{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:6px;background:linear-gradient(180deg,#323232,#222222);box-shadow:0 0 0 1px #333}
.mark span{background:#FFFFFF;border-radius:2px}.mark span:nth-child(4){opacity:.35}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--field);color:var(--ink)}
.spacer{flex:1}

/* landing */
.story{max-width:1080px;margin:0 auto;padding-block:64px 32px;display:flex;flex-direction:column;gap:88px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.hero h1{font-family:var(--font-display);font-size:var(--fs-display);line-height:1.02;letter-spacing:-0.035em;margin:12px 0 16px;font-weight:700;text-wrap:balance}
.hero .lead{font-size:19px;line-height:1.5;color:var(--ink-2);margin:0 0 28px;max-width:40ch}
.ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero-art{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:14px}
.mini-row{display:flex;align-items:center;gap:6px}
.mini-row.ghost{opacity:.4}
.mini{flex:1;min-width:0;background:var(--field);border-radius:10px;padding:6px}
.mini .pic{width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden}
.mini-wire{width:10px;height:2px;background:var(--ink);border-radius:2px;flex:none}
.mini.deck{flex:1.3;background:var(--panel);border:1px solid var(--line-2)}
.mini.deck .pic{aspect-ratio:4/5}
.axis{display:flex;justify-content:space-between;gap:8px}
.sec{display:flex;flex-direction:column;gap:20px}
.sec h2{font-family:var(--font-display);font-size:34px;letter-spacing:-0.025em;line-height:1.1;margin:0;text-wrap:balance}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.vs>div{padding:16px 20px;border-top:1px solid var(--line)}
.vs>div:nth-child(odd){color:var(--ink-2);border-right:1px solid var(--line)}
.vs>div:nth-child(even){font-weight:600}
.vs>.th{border-top:none;background:var(--field);font-size:var(--fs-cap);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)!important}
.quote{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px}
.quote blockquote{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.3;letter-spacing:-0.015em;font-weight:600;text-wrap:balance}
.quote p{margin:0;color:var(--ink-2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:var(--fs-body);font-weight:700}
.card p{margin:0;color:var(--ink-2)}
.ic{width:36px;height:36px;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--field);font-size:var(--fs-cap);font-weight:600;white-space:nowrap}
.chip.ink{background:var(--ink);color:var(--panel)}
.stackviz{display:flex;flex-direction:column;gap:6px}
.stackviz div{min-height:36px;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:var(--fs-cap);font-weight:600}
.stackviz div:first-child{background:var(--panel);border:1px solid var(--line-2)}
.stackviz div:nth-child(3){opacity:.55}
.band{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px}

/* playground */
.play{padding-block:28px 96px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:60px}
.play-head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topbar-h, 61px));z-index:20;display:flex;align-items:center;gap:8px;background:var(--canvas-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:10px;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.blocks-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.blocks-bar::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:0 14px 0 6px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:grab;user-select:none;-webkit-user-select:none}
.pchip:hover{border-color:var(--line-2)}
.itile{width:32px;height:32px;border-radius:9px;background:var(--field);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.jar{flex:none;display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--panel)}
.jar .jbar{width:96px;height:6px;border-radius:999px;background:var(--field-2);overflow:hidden;display:flex}
.jar .fill{height:100%;background:var(--ink);transition:width .35s ease}
.jar .plan{height:100%;background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 5px);opacity:.45;transition:width .35s ease}
.jar b{font-weight:600}
.delta{font-size:var(--fs-cap);font-weight:600;color:var(--ink-2);animation:rise .25s ease;white-space:nowrap}
.flows{display:flex;flex-direction:column;gap:20px}
.flow{border-radius:24px;border:1px solid var(--line);background:color-mix(in srgb, var(--panel) 40%, transparent);padding:20px;display:flex;flex-direction:column;gap:14px;animation:slide .45s cubic-bezier(.2,.8,.2,1) both}
.flow.top{background:color-mix(in srgb, var(--panel) 65%, transparent)}
.flow.kept{border-color:var(--ink)}
.flow-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:var(--tap)}
.flow-tools{display:flex;gap:6px;margin-left:auto;align-items:center}
.voters{display:flex}
.av{width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--canvas)}
.av+.av{margin-left:-6px}
.tipline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-ctl);padding:4px 4px 4px 14px;animation:rise .25s ease}
.tipline span{flex:1;min-width:200px}
.row-scroll{overflow-x:auto;padding:4px 2px 12px}
.row{display:flex;align-items:flex-start;width:max-content}

/* block */
.block{width:280px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:14px;padding:16px;animation:snap .35s ease both}
.block.busy{border-color:var(--ink)}
.bhead{display:flex;align-items:center;gap:10px}
.bhead .t{font-weight:700;line-height:1.2}
.bhead .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.bhead .tt .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:var(--tap);height:var(--tap);margin:-10px -10px -10px 0;border:none;background:transparent;color:var(--ink-3);display:flex;align-items:center;justify-content:center;border-radius:10px;flex:none;opacity:.6}
.xbtn:hover{opacity:1;background:var(--field);color:var(--ink)}
.model{display:flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--field);width:100%;text-align:left;font-size:var(--fs-cap)}
.model:hover{border-color:var(--line-2)}
.model b{font-weight:600;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model span{color:var(--ink-2)}
.ctl-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--field)}
.stepper button{width:var(--tap);height:var(--tap);border:none;background:transparent;font-size:20px;line-height:1;border-radius:var(--r-ctl)}
.stepper button:hover{background:var(--field-2)}
.stepper .v{min-width:24px;text-align:center;font-weight:600}
.seg{display:flex;background:var(--field-2);border-radius:var(--r-ctl);padding:3px;gap:3px}
.seg button{flex:1;white-space:nowrap;min-height:38px;border:none;border-radius:9px;background:transparent;font-size:var(--fs-cap);font-weight:600;color:var(--ink-2);padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tiles{display:grid;grid-template-columns:repeat(5,44px);gap:5px}
.tile{position:relative;width:44px;height:44px;padding:0;border:none;border-radius:8px;overflow:hidden;background:transparent}
.tile.tall{height:55px}
.tile.ghost{border:1.5px dashed var(--line-2)}
.tile.ghost.busy,.ghost.busy{animation:shimmer .9s ease infinite}
.tile.in{animation:pop .35s ease both}
.tile.liked{outline:2.5px solid var(--ink);outline-offset:2px}
.zoomable{cursor:zoom-in}
.zoomable::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .15s ease}
.zoomable:hover::after{background:rgba(0,0,0,.08)}
.tile svg,svg.art{display:block;width:100%;height:100%}
.heart{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.heart svg{width:9px;height:9px}
.refs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ref{width:32px;height:32px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1.5px var(--line-2);flex:none}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.upload{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 12px;border-radius:var(--r-ctl);border:1.5px dashed var(--line-2);font-size:var(--fs-cap);font-weight:600;color:var(--ink-2);cursor:pointer}
.upload:hover{border-color:var(--ink-3);color:var(--ink)}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.srow{display:flex;align-items:center;gap:6px}
.src{width:24px;height:24px;border-radius:6px;overflow:hidden;flex:none;opacity:.8}
.arrow{color:var(--ink-3);flex:none;display:flex}
.pair{display:flex;align-items:center;gap:8px}
.pair .lo{width:24px;height:30px;border-radius:5px;overflow:hidden;filter:blur(1px) saturate(.8);flex:none}
.pair .hi{position:relative;width:44px;height:55px;border-radius:8px;overflow:hidden;flex:none}
.tag4{position:absolute;left:3px;bottom:3px;font-size:10px;font-weight:700;padding:1px 4px;border-radius:4px;background:#FFFFFF;color:#1B1B1A}
.ghostbox{border:1.5px dashed var(--line-2);border-radius:6px}
.stack{display:flex;flex-direction:column;gap:6px}
.screen{position:relative;border-radius:12px;overflow:hidden;background:var(--field);display:flex;align-items:center;justify-content:center;margin:0 auto;max-width:100%}
.screen svg.art,.vreel svg.art,.reel svg.art{position:absolute;inset:0}
.playbtn{position:absolute;inset:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.playbtn span{width:44px;height:44px;border-radius:999px;background:rgba(20,20,20,.55);display:flex;align-items:center;justify-content:center;transition:opacity .2s ease}
.prog{width:100%;height:3px;border-radius:999px;background:var(--field-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink)}
.prog i.run{animation:prog 8s linear forwards}
.track{display:flex;align-items:center;gap:12px;background:var(--field);border-radius:var(--r-ctl);padding:8px}
.track .pb{width:var(--tap);height:var(--tap);border-radius:999px;flex:none;padding:0}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:36px}
.wave span{flex:1;border-radius:3px;background:var(--line-2);transform-origin:center}
.wave.live span{background:var(--ink-3)}
.wave.on span{animation:bar .8s ease infinite}
.wave.on span.lit{background:var(--ink)}
textarea.prompt{width:100%;resize:vertical;min-height:84px;padding:12px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--field);font-size:var(--fs-body);line-height:1.45}
textarea.prompt:focus{outline:none;border-color:var(--ink-3);box-shadow:0 0 0 3px var(--field-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:var(--tap);padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:var(--fs-cap);font-weight:600;color:var(--ink-2)}
.chips button:hover{color:var(--ink);border-color:var(--line-2)}
.sent{background:var(--field);border-radius:var(--r-ctl);padding:12px;font-size:var(--fs-cap);line-height:1.45;color:var(--ink-2)}
.sent b{color:var(--ink);font-weight:600}
.pin{display:flex;align-items:center;gap:6px;font-size:var(--fs-cap);color:var(--ink-2);min-width:0}
.pin span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busyline{display:flex;align-items:center;gap:8px;font-size:var(--fs-cap);font-weight:600;animation:shimmer .9s ease infinite}
.busyline i{width:8px;height:8px;border-radius:999px;background:var(--ink)}
.foot{display:flex;flex-direction:column;gap:10px;margin-top:2px;border-top:1px solid var(--line);padding-top:14px}
.price{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price b{font-weight:700}

/* strings */
.wire{flex:none;width:68px;height:200px;margin:0 -4px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.wire svg{overflow:visible}
.wl{position:absolute;top:calc(50% - 40px);left:50%;transform:translateX(-50%);font-size:var(--fs-cap);font-weight:600;background:var(--panel);border:1px solid var(--line);padding:1px 8px;border-radius:999px;white-space:nowrap}
.plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--tap);height:var(--tap);border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.plus span{width:26px;height:26px;border-radius:999px;background:var(--panel);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--ink-2);transition:all .15s ease}
.plus:hover span,.wire.hot .plus span,.wire.drop .plus span{width:32px;height:32px;background:var(--ink);color:var(--panel);border-color:var(--ink)}
.flowpath{animation:flow 1s linear infinite}
.empty{width:300px;flex:none;min-height:220px;border:2px dashed var(--line-2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:color-mix(in srgb, var(--panel) 50%, transparent)}
.empty.drop{border-color:var(--ink);background:var(--field)}

/* deck */
.deck{width:380px;flex:none;background:var(--panel);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow-2);padding:18px;display:flex;flex-direction:column;gap:16px}
.deck.drop{outline:2px dashed var(--ink);outline-offset:4px}
.deck-head{display:flex;gap:10px;align-items:center}
.media{display:flex;gap:12px;align-items:flex-start}
.fgrid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.final{position:relative;display:block;width:100%;aspect-ratio:4/5;padding:0;border:none;border-radius:8px;overflow:hidden;background:transparent;cursor:zoom-in}
.final.empty-slot{border:1.5px dashed var(--line-2);cursor:default}

.tick{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--field);font-size:var(--fs-cap);font-weight:600;color:var(--ink-2)}

.tick.ok i{background:var(--ink);border-color:var(--ink);color:var(--panel)}

.pricebox{display:flex;flex-direction:column;gap:12px;animation:rise .2s ease}

.role{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.tip{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:var(--r-ctl);padding:10px 12px;font-size:var(--fs-cap);line-height:1.4}

.sheet{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-2);overflow:hidden;animation:rise .2s ease}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line)}
.sheet-body{padding:8px;display:flex;flex-direction:column;gap:2px}
.mrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px;border-radius:12px;border:none;background:transparent;text-align:left;width:100%}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(-28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes snap{0%{transform:scale(.92);opacity:0}70%{transform:scale(1.01);opacity:1}100%{transform:scale(1)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:1}}

.sway{transform-origin:50% 92%;transform-box:view-box;animation:sway 1.6s ease-in-out infinite}

  .jar{margin-left:auto}
  .coach{left:16px!important;right:16px;bottom:max(16px, env(safe-area-inset-bottom,0px));top:auto!important;width:auto}
}

/* ---------------- money + flow logic ---------------- */
const range = n => Array.from({length:n}, (_, i) => i);
function money(cr, st){
  const amt = (cr / 1000) * st.rate;
  const num = Math.abs(amt).toFixed(2);
  const sign = amt < -0.004 ? '−' : '';
  return sign + (st.currency === 'CHF' ? 'CHF ' + num : st.currency + num);
}
const credits = v => Math.round(v).toLocaleString('en-US') + ' cr';
function tintFrom(text){
  const t = (text || '').toLowerCase();
  const P = [['pink','#EF6AA6'],['peon','#F28DBE'],['rose','#EC6E8F'],['yellow','#F2C744'],['sunflower','#F2C744'],['white','#FFFFFF'],['purple','#A877EC'],['lavender','#B79CFF'],['red','#E85454'],['orange','#F7884C'],['blue','#6E9CF0']];

  let petal = null, bg = null, dark = 0;
  P.forEach(p => { if (!petal && t.indexOf(p[0]) >= 0) petal = p[1]; });
  B.forEach(p => { if (!bg && t.indexOf(p[0]) >= 0) { bg = p[1]; dark = p[2]; } });
  return (petal || bg) ? {petal, bg, dark} : null;
}
function polishText(model, text){
  const base = (text || '').trim() || 'spring flowers';
  if (model === 'polish') return base + ', soft natural light, shallow depth of field, clean background';
  if (model === 'expand') return base + ', 85mm lens, golden rim light, dewy petals, airy pastel palette, editorial composition, safe for a 4:5 crop';
  return base;
}
const isPass = t => t === 'prompt' || t === 'sound';
function computeFlow(f){
  let prevOut = null, prevRan = true, prevTitle = '', upEst = false, planned = 0, spent = 0, proj = 0, promptIn = null, realIdx = 0;
  const info = {};
  f.blocks.forEach(b => {
    const unit = MODELS[b.model].cr;
    if (b.type === 'prompt'){
      const cost = unit;
      if (!b.ran) planned += cost; spent += b.spent; proj += b.ran ? b.spent : cost;
      info[b.id] = {count:1, cost, unit, locked:false, lockText:'', est:false, inp:0, promptIn:null};
      if (b.ran && b.out) promptIn = b.out;
      return;
    }
    const first = realIdx === 0;
    const inp = prevOut === null ? 4 : prevOut;
    let count = 1;
    if (b.type === 'mood') count = b.n;
    else if (b.type === 'stills') count = (first ? 4 : inp) * b.n;
    else if (b.type === 'up') count = inp;
    else if (b.type === 'motion') count = b.n;
    let locked = false, lockText = '';
    if (first && (b.type === 'up' || b.type === 'motion')) { locked = true; lockText = 'Needs images before it'; }
    else if (!first && b.type !== 'sound'){
      if (!prevRan) { locked = true; lockText = 'Run ' + prevTitle + ' first'; }
      else if (prevOut === 0) { locked = true; lockText = 'Tap ♥ in ' + prevTitle + ' first'; }
    }
    const est = !b.ran && upEst && b.type !== 'sound';
    const cost = count * unit;
    if (!b.ran) planned += cost; spent += b.spent; proj += b.ran ? b.spent : cost;
    info[b.id] = {count, cost, unit, locked, lockText, est, inp: first ? 0 : inp, promptIn};
    promptIn = null;

      let out = prevOut;
      if (b.type === 'mood') out = b.ran ? b.picks.length : 4;
      else if (b.type === 'stills') out = b.ran ? b.picks.length : (first ? 4 : inp);
      else if (b.type === 'up') out = b.ran ? b.items.length : inp;

function totals(S){

  });
  const top = S.flows[S.flows.length - 1];

}
function sourceItems(prev){
  if (!prev) return [];
  if (prev.type === 'mood' || prev.type === 'stills') return prev.picks.map(p => prev.items[p]).filter(Boolean);
  if (prev.type === 'up') return prev.items;
  if (prev.type === 'motion') return prev.item ? [prev.item] : [];
  return [];
}
function prevRealOf(f, idx){
  for (let i = idx - 1; i >= 0; i--) { if (!isPass(f.blocks[i].type)) return f.blocks[i]; }
  return null;
}
function nextRealOf(f, idx){
  for (let i = idx + 1; i < f.blocks.length; i++) { if (f.blocks[i].type !== 'prompt') return f.blocks[i]; }
  return null;
}
function blank(o){ return Object.assign({n:0, aspect:'', ran:false, busy:false, runs:0, spent:0, seed:1, picks:[], items:[], item:null, text:'', out:'', refs:[], per:0, res:'', aspectRan:'', modelRan:''}, o); }
function finishRun(n, fid, bid){
  const f = n.flows.find(x => x.id === fid); if (!f) return null;
  const b = f.blocks.find(x => x.id === bid); if (!b) return null;
  const info = computeFlow(f).info[bid];
  const idx = f.blocks.indexOf(b);
  const prev = prevRealOf(f, idx);
  const tint = info.promptIn ? tintFrom(info.promptIn) : null;
  b.busy = false; b.ran = true; b.runs += 1; b.spent += info.cost; b.seed += 5; b.picks = [];

  else if (b.type === 'stills'){
    const favs = prev ? sourceItems(prev) : range(4).map(i => ({i, seed:b.seed, v:0, tint:null}));
    b.items = []; b.per = b.n;
    favs.forEach(fv => { for (let k = 0; k < b.n; k++) b.items.push({i:fv.i, seed:fv.seed, v:k + 1 + b.runs * 2, tint: tint || fv.tint || null}); });
  }
  else if (b.type === 'up'){ b.items = sourceItems(prev).map(x => Object.assign({}, x)); b.res = MODELS[b.model].res; }

  const mood = last('mood'), st = last('stills'), up = last('up'), mo = last('motion'), so = last('sound');

  if (up && up.ran && !up.busy && up.items.length){ finals = up.items; label = 'Stills · upscaled ' + (up.res || '4K'); model = MODELS[up.model].name; }
  else if (st && st.ran && !st.busy && st.picks.length){ finals = st.picks.map(p => st.items[p]); label = 'Stills · your ♥ images'; model = MODELS[st.model].name; }
  else if (mood && mood.ran && !mood.busy && mood.picks.length){ finals = mood.picks.map(p => mood.items[p]); label = 'Stills · moodboard ♥ (draft)'; model = MODELS[mood.model].name; }
  const reel = mo && mo.ran && !mo.busy ? mo : null;
  const sound = so && so.ran && !so.busy ? so : null;
  return {mood, st, up, mo, so, finals, label, model, reel, sound};
}

/* ---------------- audio ---------------- */
const Audio8 = (function(){
  let ac = null, master = null, nodes = [];
  function start(model, seed){
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      if (!ac) ac = new AC();
      if (ac.state === 'suspended') ac.resume();
      stop(true);
      const t0 = ac.currentTime + 0.05, dur = 8;
      master = ac.createGain();
      master.gain.setValueAtTime(0, t0); master.gain.linearRampToValueAtTime(0.9, t0 + 0.3);
      master.gain.setValueAtTime(0.9, t0 + dur - 0.7); master.gain.linearRampToValueAtTime(0, t0 + dur);
      master.connect(ac.destination);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(master);
      const tr = ((seed || 0) % 5) - 2;
      const fq = m => 440 * Math.pow(2, (m + tr - 69) / 12);
      const note = (freq, start, len, type, vol, attack, release) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, start);
        g.gain.setValueAtTime(0.0001, start); g.gain.linearRampToValueAtTime(vol, start + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, start + len + release);
        o.connect(g); g.connect(lp); o.start(start); o.stop(start + len + release + 0.05); nodes.push(o);
      };
      const chords = [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]];
      if (model === 'amb'){
        chords.forEach((ch, i) => { ch.forEach(m => note(fq(m), t0 + i*2, 1.8, 'sine', 0.06, 0.6, 0.9)); note(fq(ch[0] - 12), t0 + i*2, 1.8, 'triangle', 0.05, 0.5, 0.9); });
      } else if (model === 'score'){
        const pat = [0,1,2,3,2,1,2,3];
        chords.forEach((ch, i) => {
          note(fq(ch[0] - 24), t0 + i*2, 1.7, 'triangle', 0.14, 0.02, 0.4);
          ch.forEach(m => note(fq(m), t0 + i*2, 1.8, 'sine', 0.02, 0.4, 0.6));
          pat.forEach((p, k) => note(fq(ch[p] + 12), t0 + i*2 + k*0.25, 0.12, 'triangle', 0.09, 0.008, 0.35));
        });
      } else {
        const len = 2 * ac.sampleRate, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.8;
        const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.18; lg.gain.value = 320; lfo.connect(lg); lg.connect(bp.frequency);
        const ng = ac.createGain(); ng.gain.value = 0.22;
        noise.connect(bp); bp.connect(ng); ng.connect(master);
        noise.start(t0); noise.stop(t0 + dur); lfo.start(t0); lfo.stop(t0 + dur); nodes.push(noise, lfo);
        [0.8, 2.1, 2.4, 3.9, 5.2, 5.5, 6.7].forEach((tt, i) => {
          for (let r = 0; r < 3; r++){
            const st = t0 + tt + r * 0.11, o = ac.createOscillator(), g = ac.createGain();

            o.type = 'sine'; o.frequency.setValueAtTime(base, st); o.frequency.exponentialRampToValueAtTime(base * 1.5, st + 0.07);
            g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(0.045, st + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.09);
            o.connect(g); g.connect(master); o.start(st); o.stop(st + 0.12); nodes.push(o);
          }
        });
      }

    } catch (e) { return false; }
  }
  function stop(){
    if (master && ac){
      try { const t = ac.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 0.12); } catch (e) {}
      const old = nodes; setTimeout(() => old.forEach(x => { try { x.stop(); } catch (e) {} }), 200);
    }
    master = null; nodes = [];
  }
  return {start, stop};
})();

/* ---------------- app ---------------- */
function App(){

  function update(fn){

      const n = typeof structuredClone === 'function' ? structuredClone(prev) : JSON.parse(JSON.stringify(prev));
      fn(n);
      const before = totals(prev).next, after = totals(n).next;

  useEffect(() => { if (!S.deltaKey) return; const t = setTimeout(() => setS(p => p.deltaKey === S.deltaKey ? Object.assign({}, p, {delta:0}) : p), 1800); return () => clearTimeout(t); }, [S.deltaKey]);

    return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', set); };
  }, []);

  const findFlow = (n, fid) => n.flows.find(x => x.id === fid);
  const findBlock = (n, fid, bid) => { const f = findFlow(n, fid); return f ? f.blocks.find(x => x.id === bid) : null; };

  const A = {
    insert(fid, type, at){
      update(n => {
        const f = findFlow(n, fid); if (!f || !TYPES[type]) return;
        const t = TYPES[type], id = n.nextId++;

    setAspect(fid, bid, a){ update(n => { const b = findBlock(n, fid, bid); if (b) b.aspect = a; }); },

    addChip(fid, bid, c){ update(n => { const b = findBlock(n, fid, bid); if (b) b.text = (b.text ? b.text.replace(/[ ,]+$/, '') + ', ' : '') + c; }); },
    pick(fid, bid, i){ update(n => { const b = findBlock(n, fid, bid); if (!b) return; b.picks = b.picks.indexOf(i) >= 0 ? b.picks.filter(x => x !== i) : b.picks.concat([i]); }); },
    pickMany(fid, bid, list){ update(n => { const b = findBlock(n, fid, bid); if (b) b.picks = list.slice(); }); },
    run(fid, bid, force){
      const f = S.flows.find(x => x.id === fid); if (!f) return;
      const b = f.blocks.find(x => x.id === bid); if (!b || b.busy) return;
      const info = computeFlow(f).info[bid]; if (info.locked) return;
      if (b.type === 'motion' && !S.dontAsk && !force){ update(n => { n.preflight = {fid, bid}; }); return; }
      update(n => { const bb = findBlock(n, fid, bid); if (bb) bb.busy = true; n.preflight = null; });
      const ms = b.type === 'prompt' ? 600 : (b.type === 'motion' ? 1700 : 1150);
      timers.current.push(setTimeout(() => update(n => {
        const r = finishRun(n, fid, bid); if (!r) return;
        if (r.b.type === 'prompt'){ const nr = nextRealOf(r.f, r.idx); say(n, 'Prompt sent' + (nr ? ' to ' + TYPES[nr.type].title : '')); }
        else say(n, TYPES[r.b.type].title + ' ready · ' + $(r.info.cost));
      }), ms));
    },
    newFlow(){ update(n => { const id = n.nextId++; const name = 'Flow ' + String.fromCharCode(65 + (n.flows.length % 26)); n.flows.push({id, name, from:null, note:'', votes:[], blocks:[]}); say(n, name + ' started'); }); },
    remix(fid){
      update(n => {
        const src = findFlow(n, fid); if (!src) return;
        const id = n.nextId++;
        const name = 'Flow ' + String.fromCharCode(65 + (n.flows.length % 26));
        const blocks = src.blocks.map(b => blank({id:n.nextId++, type:b.type, model:b.model, n:b.n, aspect:b.aspect, text:b.text, refs:b.refs.slice(), seed:(n.nextId) * 3}));
        n.flows.push({id, name, from:src.name, note:'', votes:[], blocks});
        n.flowMenu = null;
        say(n, name + ' remixed from ' + src.name);
      });
    },
    deleteFlow(fid){
      if (S.playing) Audio8.stop();
      update(n => {
        const idx = n.flows.findIndex(x => x.id === fid); if (idx < 0) return;
        const f = n.flows.splice(idx, 1)[0];
        n.undo = {flow: f, idx, kept: n.kept === fid};
        if (n.kept === fid) n.kept = null;
        n.flowMenu = null; n.viewer = null; n.picker = null; n.preflight = null; n.insert = null; n.playing = null;
        say(n, f.name + ' deleted'); n.toast.undo = true;
      });
    },
    undoDelete(){
      update(n => {
        if (!n.undo) return;
        n.flows.splice(Math.min(n.undo.idx, n.flows.length), 0, n.undo.flow);
        if (n.undo.kept) n.kept = n.undo.flow.id;
        say(n, n.undo.flow.name + ' is back');
        n.undo = null;
      });
    },
    vote(fid){ update(n => { const f = findFlow(n, fid); if (f) f.votes = f.votes.indexOf('R') >= 0 ? f.votes.filter(x => x !== 'R') : f.votes.concat(['R']); n.flowMenu = null; }); },
    keep(fid){ update(n => { n.kept = n.kept === fid ? null : fid; n.flowMenu = null; if (n.kept) say(n, findFlow(n, fid).name + ' is the team pick'); }); },
    preset(fid, key){ update(n => { const f = findFlow(n, fid); const p = PRESETS[key]; if (!f) return; f.blocks.forEach(b => { if (p.m[b.type]) b.model = p.m[b.type]; }); }); },
    upload(fid, bid, e){
      const files = e && e.target && e.target.files ? Array.prototype.slice.call(e.target.files, 0, 6) : [];
      files.forEach(file => {
        if (!file.type || file.type.indexOf('image/') !== 0) return;
        const rd = new FileReader();
        rd.onload = () => update(n => { const b = findBlock(n, fid, bid); if (b) { b.refs = b.refs.concat([{src:String(rd.result)}]).slice(-8); say(n, 'Reference added'); } });
        rd.readAsDataURL(file);
      });
      if (e && e.target) e.target.value = '';
    },
    play(key, soundBlock){
      if (S.playing === key){ Audio8.stop(); update(n => { n.playing = null; }); return; }
      if (soundBlock) Audio8.start(soundBlock.modelRan || soundBlock.model, soundBlock.seed); else Audio8.stop();
      update(n => { n.playing = key; });
      timers.current.push(setTimeout(() => setS(p => p.playing === key ? Object.assign({}, p, {playing:null}) : p), 8000));
    },
    openViewer(v, soundBlock){
      update(n => { n.viewer = v; });
      if (v.kind === 'reel'){
        const key = 'view-' + v.fid;
        if (soundBlock) Audio8.start(soundBlock.modelRan || soundBlock.model, soundBlock.seed); else Audio8.stop();
        update(n => { n.playing = key; });
        timers.current.push(setTimeout(() => setS(p => p.playing === key ? Object.assign({}, p, {playing:null}) : p), 8000));
      }
    },
    closeViewer(){ Audio8.stop(); update(n => { n.viewer = null; n.playing = null; }); },
    reset(silent){ timers.current.forEach(clearTimeout); timers.current = []; Audio8.stop(); setS(p => Object.assign(freshState(p.settings, p.seen), silent ? {} : {toast:{text:'Demo reset', key:++toastKey.current}})); },
    setSettings(patch){ update(n => { Object.assign(n.settings, patch); }); },
    openPicker(fid, bid){ update(n => { n.picker = {fid, bid}; n.insert = null; }); },
    openInsert(fid, at, r, label){ update(n => { n.insert = (n.insert && n.insert.fid === fid && n.insert.at === at) ? null : {fid, at, x: r.left + r.width / 2, y: r.bottom, label}; }); },
    openPreflight(fid, bid){ update(n => { n.preflight = {fid, bid}; }); },
    togglePrice(fid, open){ update(n => { n.priceOpen[fid] = open == null ? !n.priceOpen[fid] : open; }); },
    seeHint(id){ update(n => { if (n.seen.indexOf(id) < 0) n.seen.push(id); }); },
    set(patch){ setS(p => Object.assign({}, p, patch)); }
  };

  const dnd = {
    start(type){ return e => { dragType.current = type; try { e.dataTransfer.setData('text/plain', type); e.dataTransfer.effectAllowed = 'copy'; } catch (er) {} }; },
    end(){ dragType.current = null; setS(p => p.dropOn ? Object.assign({}, p, {dropOn:null}) : p); },
    over(key){ return e => { if (!dragType.current) return; e.preventDefault(); if (S.dropOn !== key) setS(p => Object.assign({}, p, {dropOn:key})); }; },
    leave(key){ return () => setS(p => p.dropOn === key ? Object.assign({}, p, {dropOn:null}) : p); },
    drop(fid, at){ return e => { e.preventDefault(); let t = dragType.current; try { t = t || e.dataTransfer.getData('text/plain'); } catch (er) {} dragType.current = null; if (t) A.insert(fid, t, at); else setS(p => Object.assign({}, p, {dropOn:null})); }; }
  };

  const topId = S.flows.length ? S.flows[S.flows.length - 1].id : null;
  const free = st.budget - T.spent - T.planned;
  const scrollTo = id => { const el = document.getElementById(id); if (el) el.scrollIntoView({behavior:'smooth'}); };
  const startQuick = () => { A.reset(true); setTimeout(() => { setS(p => Object.assign({}, p, {qs:0, tour:null})); }, 60); };

  return html`

        <nav className="nav" aria-label="Sections">
          <a href="#story" onClick=${e => { e.preventDefault(); scrollTo('story'); }}>Idea</a>
          <a href="#playground" onClick=${e => { e.preventDefault(); scrollTo('playground'); }}>Try it</a>
        </nav>
        <div className="spacer"></div>
        <button className="btn btn-ghost btn-icon" aria-label="Settings and full tour" onClick=${() => A.set({settingsOpen: !S.settingsOpen})}><${Icon} n="gear" s=${19}/></button>
      </div>
    </header>

    <${Story} onStart=${startQuick} onTour=${startTour} go=${scrollTo}/>

    <section id="playground" className="wrap play">
      <div className="play-head">
        <h2 className="h">Spring campaign</h2>
        <span className="cap">Brief: 6 stills in 4K and one 9:16 Reel. Fresh, bright, golden hour.</span>
      </div>

      <div className="bar">
        <div className="blocks-bar" data-tour="palette" role="group" aria-label="Blocks. Tap to add, or drag onto a string.">
          ${ORDER.map(k => {
            const add = () => topId && A.insert(topId, k, null);
            return html`<div key=${k} className="pchip" role="button" tabIndex="0" draggable="true" data-tour=${'pal-' + k} onDragStart=${dnd.start(k)} onDragEnd=${dnd.end} onClick=${add} onKeyDown=${e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); add(); } }} aria-label=${'Add ' + TYPES[k].title}>
              <span className="itile"><${Icon} n=${k} s=${17}/></span>${TYPES[k].title}
            </div>`;
          })}
          <button className="btn btn-ghost" style=${{flex:'none'}} onClick=${A.newFlow}>+ New flow</button>
        </div>
        ${S.delta ? html`<span key=${S.deltaKey} className="delta num" role="status">${(S.delta > 0 ? '+' : '−') + $(Math.abs(S.delta))}</span>` : null}
        <button className="jar" data-tour="jar" aria-label=${'Credit jar: ' + (free < 0 ? $(-free) + ' over budget' : $(free) + ' left') + '. Show details.'} onClick=${() => A.set({jarOpen: !S.jarOpen})}>
          <span className="jbar" aria-hidden="true"><span className="fill" style=${{width: Math.min(100, T.spent / st.budget * 100) + '%'}}></span><span className="plan" style=${{width: Math.max(0, Math.min(100 - T.spent / st.budget * 100, T.planned / st.budget * 100)) + '%'}}></span></span>
          <span className="num"><b>${free < 0 ? $(-free) : $(free)}</b> <span className="cap">${free < 0 ? 'over' : 'left'}</span></span>
        </button>
      </div>

      <div className="flows">
        ${S.flows.length === 0 ? html`<div className="flow" style=${{alignItems:'center',textAlign:'center',padding:'40px 20px'}}><p style=${{margin:0}}>No flows yet. Start one to plan your campaign.</p><button className="btn btn-primary" onClick=${A.newFlow}>Start a flow</button></div>` : null}
        ${S.flows.slice().reverse().map(f => html`<${Flow} key=${f.id} f=${f} S=${S} A=${A} dnd=${dnd} $=${$} isTop=${f.id === topId} hint=${f.id === topId ? hint : null}/>`)}
      </div>
    </section>

    ${S.jarOpen ? html`<${JarPop} S=${S} T=${T} $=${$} free=${free} A=${A}/>` : null}
    ${S.picker ? html`<${Picker} S=${S} A=${A} $=${$} close=${() => A.set({picker:null})}/>` : null}
    ${S.preflight ? html`<${Preflight} S=${S} A=${A} $=${$} T=${T} update=${update}/>` : null}
    ${S.viewer ? html`<${Viewer} S=${S} A=${A} update=${update}/>` : null}
    ${S.insert ? html`<${InsertMenu} S=${S} A=${A} close=${() => A.set({insert:null})}/>` : null}
    ${S.flowMenu ? html`<${FlowMenu} S=${S} A=${A} close=${() => A.set({flowMenu:null})}/>` : null}
    ${S.settingsOpen ? html`<${Settings} S=${S} A=${A} startTour=${startTour} startQuick=${startQuick} close=${() => A.set({settingsOpen:false})}/>` : null}
    ${S.qs != null ? html`<${QuickStart} S=${S} A=${A} $=${$} startTour=${startTour}/>` : null}
    ${S.tour != null ? html`<${Tour} S=${S} setS=${setS} A=${A}/>` : null}
    ${S.toast ? html`<div key=${S.toast.key} className=${'toast' + (S.tour != null || S.qs != null ? ' up' : '')} role="status">${S.toast.text}${S.toast.undo && S.undo ? html`<button className="toast-act" onClick=${A.undoDelete}>Undo</button>` : null}</div>` : null}
  `;
}

/* ---------------- flow ---------------- */
function Flow({f, S, A, dnd, $, isTop, hint}){
  const r = computeFlow(f);
  const d = deckOf(f);
  const kept = S.kept === f.id;
  const empty = f.blocks.length === 0;
  const tourKey = isTop ? 'top' : (f.id === 1 ? 'a' : 'f' + f.id);
  const nextId = isTop ? nextStepId(f) : null;
  let sugg = null;
  if (isTop && !nextId && S.qs == null && S.tour == null && !f.blocks.some(b => b.busy)){
    const NEXT = {mood:'stills', stills:'up', up:'motion', motion:'sound'};
    const reals = f.blocks.filter(b => b.type !== 'prompt');
    const last = reals[reals.length - 1];
    if (!last) sugg = null;
    else if (NEXT[last.type]){
      const nt = NEXT[last.type];
      const needPicks = (last.type === 'mood' || last.type === 'stills') && last.ran && last.picks.length === 0;
      const why = {stills:'turns your ♥ into finished pictures', up:'makes your picks sharp, up to 4K', motion:'turns your images into a Reel', sound:'adds music to the Reel'}[nt];
      sugg = {text: (needPicks ? 'Tap ♥ on what you like. Next, ' : 'Next: ') + TYPES[nt].title + ' ' + why + '.', label:'Add ' + TYPES[nt].title, go: () => A.insert(f.id, nt, null)};
    } else sugg = {text:'This flow is complete. Watch the Reel in the deck, or remix it.'};
  }
  const status = kept ? '★ Team pick' : (f.from ? 'Remix of ' + f.from : (isTop ? 'Latest' : ''));
  return html`<section className=${'flow' + (isTop ? ' top' : '') + (kept ? ' kept' : '')} aria-label=${f.name} data-tour=${tourKey + '-flow'}>
    <div className="flow-head">
      <h3 className="h">${f.name}</h3>
      ${status ? html`<span className="cap">${status}</span>` : null}
      <div className="flow-tools">
        ${f.votes.length ? html`<span className="voters" title=${'Votes: ' + f.votes.map(p => PEOPLE[p].name).join(', ')}>${f.votes.map(p => html`<span key=${p} className="av" style=${{background: PEOPLE[p].bg, color: PEOPLE[p].fg}}>${p}</span>`)}</span>` : null}
        <button className="btn" data-tour=${tourKey + '-remix'} onClick=${() => A.remix(f.id)}><${Icon} n="remix" s=${16}/>Remix</button>
        <button className="btn btn-icon btn-ghost" aria-label=${'More for ' + f.name} onClick=${e => { const rc = e.currentTarget.getBoundingClientRect(); A.set({flowMenu:{fid:f.id, x:rc.right, y:rc.bottom, t:rc.top}}); }}>⋯</button>
      </div>
    </div>
    ${sugg ? html`<div className="tipline" role="note"><span>${sugg.text}</span>${sugg.go ? html`<button className="btn btn-primary" onClick=${sugg.go}>${sugg.label}</button>` : null}</div>` : null}
    ${!sugg && hint ? html`<div className="tipline" role="note"><span>${hint.text}</span>
      ${hint.act === 'price' ? html`<button className="btn btn-ghost" onClick=${() => { A.togglePrice(f.id, true); A.seeHint(hint.id); }}>Show me</button>` : null}
      <button className="btn btn-ghost" onClick=${() => A.seeHint(hint.id)}>Got it</button></div>` : null}
    <div className="row-scroll">
      <div className="row">
        ${f.blocks.map((b, idx) => html`<${React.Fragment} key=${b.id}>
          <${Block} f=${f} b=${b} idx=${idx} info=${r.info[b.id]} S=${S} A=${A} $=${$} tourKey=${tourKey} isNext=${b.id === nextId}/>
          <${Wire} f=${f} b=${b} idx=${idx} S=${S} A=${A} dnd=${dnd} tourKey=${tourKey}/>
        <//>`)}
        ${empty ? html`<${React.Fragment}>
          <div className=${'empty' + (S.dropOn === 'e' + f.id ? ' drop' : '')} onDragOver=${dnd.over('e' + f.id)} onDragLeave=${dnd.leave('e' + f.id)} onDrop=${dnd.drop(f.id, null)}>
            <span>Start with a moodboard.</span>
            <button className="btn btn-primary" onClick=${() => A.insert(f.id, 'mood', null)}>Add Moodboard</button>
          </div>
          <div className="wire" aria-hidden="true"><svg width="68" height="60" viewBox="0 0 68 60"><path d="M5 30 C 24 50, 44 50, 63 30" stroke="var(--line-2)" stroke-width="2" fill="none" stroke-dasharray="2 6" stroke-linecap="round"/></svg></div>
        <//>` : null}
        <${Deck} f=${f} d=${d} r=${r} S=${S} A=${A} dnd=${dnd} $=${$} tourKey=${tourKey}/>
      </div>
    </div>
  </section>`;
}

function HeartTile({k, picked, onClick, label, tall, delay}){
  return html`<button className=${'tile in zoomable' + (tall ? ' tall' : '') + (picked ? ' liked' : '')} style=${{animationDelay: delay}} aria-label=${'Open ' + label + ' big' + (picked ? ', liked' : '')} onClick=${onClick}>
    <${Flower} k=${k}/>${picked ? html`<span className="heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d=${HEART} fill="#1B1B1A"/></svg></span>` : null}
  </button>`;
}

function Block({f, b, idx, info, S, A, $, tourKey, isNext}){
  const t = TYPES[b.type], m = MODELS[b.model];
  const live = b.ran && !b.busy;
  const nextReal = nextRealOf(f, idx);
  const first = f.blocks.findIndex(x => x.type === b.type) === idx;
  const tk = first ? tourKey + '-' + b.type : null;
  const playKey = 'b-' + f.id + '-' + b.id;
  const playing = S.playing === playKey;
  const ghost = (w, h, i) => html`<span key=${'g' + i} className=${'tile ghost' + (b.busy ? ' busy' : '')} style=${{width:w, height:h, animationDelay:(i * 0.05) + 's'}}></span>`;
  let body = null, sub = t.job;

  if (b.type === 'mood'){
    const n = live ? b.items.length : info.count;
    sub = live ? 'Tap an idea to see it big' : t.job;
    body = html`
      <div className="tiles" data-tour=${tk ? tk + '-tiles' : null}>
        ${range(Math.min(n, 15)).map(i => live
          ? html`<${HeartTile} key=${b.runs + '-' + i} k=${b.items[i]} picked=${b.picks.indexOf(i) >= 0} label=${'idea ' + (i + 1)} delay=${(i * 0.025) + 's'} onClick=${() => A.openViewer({fid:f.id, kind:'image', src:'block', bid:b.id, i})}/>`
          : ghost('44px', '44px', i))}
      </div>
      ${n > 15 ? html`<span className="cap">+${n - 15} more</span>` : null}
      <div className="refs">
        ${b.refs.map((rf, i) => html`<button key=${i} className="ref zoomable" style=${{padding:0,border:'none',position:'relative'}} aria-label=${'Open reference ' + (i + 1) + ' big'} onClick=${() => A.openViewer({fid:f.id, kind:'image', src:'ref', bid:b.id, i})}>${rf.src ? html`<img src=${rf.src} alt=""/>` : html`<${Flower} k=${rf.k}/>`}</button>`)}
        <label className="upload"><${Icon} n="upl" s=${14}/>${b.refs.length ? 'Add' : 'Add your own photos'}<input type="file" accept="image/*" multiple onChange=${e => A.upload(f.id, b.id, e)} aria-label="Upload reference photos"/></label>
      </div>`;
  } else if (b.type === 'stills'){
    if (live){
      const per = Math.max(1, b.per || 1), groups = Math.ceil(b.items.length / per);
      sub = 'Tap to check, ♥ the keepers';
      body = html`<div className="stack">${range(Math.min(groups, 4)).map(g => html`<div key=${g} className="srow">
          <span className="src"><${Flower} k=${Object.assign({}, b.items[g * per], {v:0, tint:null})}/></span>
          <span className="arrow"><${Icon} n="arrow" s=${14}/></span>
          ${range(per).map(k => { const i = g * per + k; return html`<${HeartTile} key=${b.runs + '-' + i} tall=${true} k=${b.items[i]} picked=${b.picks.indexOf(i) >= 0} label=${'image ' + (i + 1)} delay=${(i * 0.03) + 's'} onClick=${() => A.openViewer({fid:f.id, kind:'image', src:'block', bid:b.id, i})}/>`; })}
        </div>`)}${groups > 4 ? html`<span className="cap">+${groups - 4} more</span>` : null}</div>`;
    } else {
      const g = info.locked ? 2 : Math.min(info.inp || 4, 4);
      if (info.locked) sub = 'Uses your ♥ from the step before';
      body = html`<div className="stack">${range(g).map(r => html`<div key=${r} className="srow"><span className="src ghostbox"></span><span className="arrow"><${Icon} n="arrow" s=${14}/></span>${range(b.n).map(k => ghost('44px', '55px', r * b.n + k))}</div>`)}</div>`;
    }
  } else if (b.type === 'up'){
    const n = live ? b.items.length : info.count;
    const res = live ? (b.res || '4K') : (m.res || '4K');
    body = html`<div className="stack">${range(Math.min(Math.max(n, 1), 3)).map(i => html`<div key=${b.runs + '-' + i} className="pair">
        ${live ? html`<span className="lo"><${Flower} k=${b.items[i]}/></span>` : html`<span className="lo ghostbox" style=${{filter:'none'}}></span>`}
        <span className="arrow"><${Icon} n="arrow" s=${14}/></span>
        ${live ? html`<button className="hi zoomable" style=${{padding:0,border:'none'}} aria-label=${'Open upscale ' + (i + 1) + ' big'} onClick=${() => A.openViewer({fid:f.id, kind:'image', src:'block', bid:b.id, i})}><${Flower} k=${b.items[i]}/><span className="tag4">${res}</span></button>` : html`<span className=${'hi ghostbox' + (b.busy ? ' busy' : '')}></span>`}
      </div>`)}${n > 3 ? html`<span className="cap">+${n - 3} more</span>` : null}</div>`;
    sub = live ? n + ' images, now ' + res : t.job;
  } else if (b.type === 'motion'){
    const asp = live ? b.aspectRan : b.aspect;
    const dim = {'9:16':[90,160],'1:1':[140,140],'16:9':[246,138]}[asp] || [90,160];
    body = html`
      <div className="seg" role="group" aria-label="Video format">${['9:16','1:1','16:9'].map(a => html`<button key=${a} aria-pressed=${b.aspect === a} onClick=${() => A.setAspect(f.id, b.id, a)}>${a}</button>`)}</div>
      <div className="screen" style=${{width: dim[0] + 'px', height: dim[1] + 'px', border: live ? 'none' : '1.5px dashed var(--line-2)', background: live ? 'var(--field)' : 'transparent', animation: b.busy ? 'shimmer .9s ease infinite' : 'none'}}>
        ${live ? html`<${React.Fragment}><${Flower} k=${b.item} anim=${playing} drift=${playing}/>
          <button className="playbtn" aria-label=${playing ? 'Pause' : 'Play'} onClick=${() => A.play(playKey, deckOf(f).sound)}><span style=${{opacity: playing ? 0.2 : 1}}><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d=${playing ? PAUSE : PLAY} fill="#FFFFFF"/></svg></span></button><//>`
        : html`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--line-2)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d=${PLAY}/></svg>`}
      </div>
      ${live ? html`<div className="prog"><i key=${playing ? 'on' : 'off'} className=${playing ? 'run' : ''}></i></div>` : null}`;
    sub = live ? (deckOf(f).sound ? 'Tap play · with sound' : 'Tap play · no sound yet') : t.job;
  } else if (b.type === 'sound'){
    const hs = [10,18,28,16,24,34,22,12,30,18,26,10,16,30,14,22,32,20];
    const changed = live && b.model !== (b.modelRan || b.model);
    body = html`<div className="track">
        <button className=${'btn pb ' + (live ? 'btn-primary' : '')} disabled=${!live} aria-label=${playing ? 'Pause' : 'Play'} onClick=${() => A.play(playKey, b)}><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d=${playing ? PAUSE : PLAY} fill="currentColor"/></svg></button>
        <div className=${'wave' + (live ? ' live' : '') + (playing ? ' on' : '')} aria-hidden="true">${hs.map((h, i) => html`<span key=${i} className=${i < 11 ? 'lit' : ''} style=${{height: (live ? hs[(i + b.seed) % hs.length] : 6) + 'px', animationDelay: (i * 0.04) + 's'}}></span>`)}</div>
      </div>`;
    sub = changed ? 'Run again to hear ' + m.name : (live ? 'Tap play to listen' : t.job);
  } else if (b.type === 'prompt'){
    const tgt = nextReal ? TYPES[nextReal.type].title : 'the next step';
    sub = 'Sent to ' + tgt;
    body = html`
      <textarea className="prompt" id=${'p-' + b.id} rows="3" value=${b.text} placeholder="Describe the look you want" aria-label=${'What you want for ' + tgt} onChange=${e => A.setText(f.id, b.id, e.target.value)}></textarea>
      <div className="chips">${['golden hour','yellow petals','night sky'].map(c => html`<button key=${c} onClick=${() => A.addChip(f.id, b.id, c)}>+ ${c}</button>`)}</div>
      ${live && b.out ? html`<div className="sent"><b>Sent:</b> ${b.out}</div>` : null}`;
  }

  let note = '';
  if (live && (b.type === 'mood' || b.type === 'stills')){
    const k = b.picks.length;
    if (k && nextReal) note = k + ' ♥ go to ' + TYPES[nextReal.type].title;
    else if (k) note = k + ' ♥ · add a next step to use them';
  }
  const locked = info.locked;
  const est = !b.ran && info.est;
  const priceText = info.cost ? (est ? '≈ ' : '') + $(info.cost) : 'Free';
  const label = b.busy ? 'Working…' : (locked ? info.lockText : (b.type === 'prompt' ? (b.ran ? 'Send again' : 'Send prompt') : (b.ran ? 'Run again' : 'Run')));
  const cls = 'btn btn-wide ' + (isNext ? 'btn-primary' : (b.ran ? 'btn-ghost' : ''));

  return html`<article className=${'block' + (b.busy ? ' busy' : '')} aria-label=${t.title} data-tour=${tk}>
    <div className="bhead">
      <span className="itile"><${Icon} n=${b.type} s=${17}/></span>
      <span className="tt"><span className="t">${t.title}</span><span className="cap">${sub}</span></span>
      <button className="xbtn" aria-label=${'Remove ' + t.title} onClick=${() => A.remove(f.id, b.id)}><${Icon} n="x" s=${15}/></button>
    </div>
    ${body}
    ${t.step ? html`<div className="ctl-row"><span className="cap">${t.step.label}</span><div className="stepper">
      <button aria-label=${'Fewer: ' + t.step.label} onClick=${() => A.setN(f.id, b.id, Math.max(t.step.min, b.n - t.step.by))}>−</button>
      <span className="v num">${b.n}</span>
      <button aria-label=${'More: ' + t.step.label} onClick=${() => A.setN(f.id, b.id, Math.min(t.step.max, b.n + t.step.by))}>+</button>
    </div></div>` : null}
    ${info.promptIn ? html`<div className="pin"><${Icon} n="prompt" s=${13}/><span>${info.promptIn}</span></div>` : null}
    ${b.busy ? html`<div className="busyline" role="status"><i></i>${b.type === 'prompt' ? 'Sending…' : 'Making ' + info.count + ' ' + t.unit + '…'}</div>` : (note ? html`<span className="cap" style=${{color:'var(--ink)',fontWeight:600}}>${note}</span>` : null)}
    <div className="foot" data-tour=${tk ? tk + '-foot' : null}>
      <button className="model" aria-label=${'Model: ' + m.name + '. Change'} onClick=${() => A.openPicker(f.id, b.id)}><b>${m.name}</b><span className="num">${m.cr ? $(m.cr) + ' each' : 'free'}</span><span className="arrow"><${Icon} n="chev" s=${14}/></span></button>
      <div className="price"><span className="cap">${b.ran ? 'Again' : (est ? 'About' : 'Price')}</span><b className="num">${priceText}</b></div>
      <button className=${cls} disabled=${locked || b.busy} onClick=${() => A.run(f.id, b.id)} data-tour=${tk ? tk + '-run' : null}>${label}</button>
    </div>
  </article>`;
}

function Wire({f, b, idx, S, A, dnd, tourKey}){
  const t = TYPES[b.type];
  const next = f.blocks[idx + 1];
  const live = b.ran && !b.busy;
  const active = live && !((b.type === 'mood' || b.type === 'stills') && b.picks.length === 0);
  let lab = '';
  if ((b.type === 'mood' || b.type === 'stills') && live && b.picks.length) lab = b.picks.length + ' ♥';
  const key = 'w' + f.id + '-' + (idx + 1);
  const drop = S.dropOn === key;
  const open = S.insert && S.insert.fid === f.id && S.insert.at === idx + 1;
  const nextTitle = next ? TYPES[next.type].title : 'the deck';
  return html`<div className=${'wire' + (drop ? ' drop' : '') + (open ? ' hot' : '')} onDragOver=${dnd.over(key)} onDragLeave=${dnd.leave(key)} onDrop=${dnd.drop(f.id, idx + 1)} data-tour=${idx === 0 ? tourKey + '-wire1' : null}>
    ${lab ? html`<span className="wl num" aria-hidden="true">${lab}</span>` : null}
    <svg width="68" height="60" viewBox="0 0 68 60" aria-hidden="true">
      <path className=${active ? 'flowpath' : ''} d="M5 30 C 24 50, 44 50, 63 30" stroke=${active || drop ? 'var(--ink)' : 'var(--line-2)'} stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray=${active ? '6 6' : '2 6'}/>
      <circle cx="5" cy="30" r="4.5" fill=${live ? 'var(--ink)' : 'var(--line-2)'}/>
      <circle cx="63" cy="30" r="4.5" fill="var(--line-2)"/>
    </svg>
    <button className="plus" aria-label=${'Add a step between ' + t.title + ' and ' + nextTitle} aria-expanded=${open} onClick=${e => A.openInsert(f.id, idx + 1, e.currentTarget.getBoundingClientRect(), nextTitle)}><span>+</span></button>
  </div>`;
}

function Deck({f, d, r, S, A, dnd, $, tourKey}){
  const key = 'd' + f.id;
  const drop = S.dropOn === key;
  const asp = d.reel ? d.reel.aspectRan : (d.mo ? d.mo.aspect : '9:16');
  const vd = {'9:16':[70,124],'1:1':[92,92],'16:9':[92,52]}[asp] || [70,124];
  const finals = d.finals.slice(0, 6);
  const nF = d.finals.length;
  const ticks = [
    {ok: nF >= 6, l: (nF >= 6 ? 6 : nF) + ' of 6 stills'},
    {ok: !!(d.up && d.up.ran && d.up.res !== '2K'), l: '4K'},
    {ok: !!(d.reel && d.reel.aspectRan === '9:16'), l: d.reel && d.reel.aspectRan !== '9:16' ? 'Reel is ' + d.reel.aspectRan + ', needs 9:16' : 'Reel 9:16'},
    {ok: !!d.sound, l: 'Sound', opt:true}
  ];
  const open = !!S.priceOpen[f.id];
  let projAll = 0; f.blocks.forEach(b => { projAll += r.info[b.id].cost; });
  let tip = null, bestSave = 0;
  f.blocks.forEach(b => {
    const t = TYPES[b.type]; if (t.role !== 'Extra') return;
    const inf = r.info[b.id]; const cheapest = t.list.slice().sort((x, y) => MODELS[x].cr - MODELS[y].cr)[0];
    const save = inf.cost - inf.count * MODELS[cheapest].cr;
    if (save > bestSave){ bestSave = save; tip = {text: t.title + ' is an extra here. A cheaper model saves ' + $(save) + '.', label:'Save ' + $(save), go: () => A.setModel(f.id, b.id, cheapest)}; }
  });
  if (!tip) f.blocks.forEach(b => {
    const t = TYPES[b.type]; if (t.role !== 'Main' || tip) return;
    const inf = r.info[b.id]; const sorted = t.list.slice().sort((x, y) => MODELS[x].cr - MODELS[y].cr);
    if (sorted.indexOf(b.model) === 0 && b.model !== t.rec){ const add = inf.count * (MODELS[t.rec].cr - MODELS[b.model].cr); tip = {text: t.title + ' is what people see. More detail costs ' + $(add) + '.', label:'Upgrade', go: () => A.setModel(f.id, b.id, t.rec)}; }
  });
  if (!tip && f.blocks.length) tip = {text:'Good balance: strong models where it shows, cheap ones elsewhere.'};

  return html`<article className=${'deck' + (drop ? ' drop' : '')} aria-label=${f.name + ' campaign deck'} onDragOver=${dnd.over(key)} onDragLeave=${dnd.leave(key)} onDrop=${dnd.drop(f.id, null)} data-tour=${tourKey + '-deck'}>
    <div className="deck-head">
      <span className="itile"><${Icon} n="deck" s=${17}/></span>
      <h4 className="h" style=${{flex:1}}>Campaign deck</h4>
      <span className="num" style=${{fontWeight:700}}>${$(r.proj)}</span>
    </div>
    ${f.blocks.length === 0 ? html`<p className="cap" style=${{margin:0}}>Your finished stills and Reel will show up here.</p>` : html`<${React.Fragment}>
      <div className="media">
        <div className="fgrid">${range(6).map(i => i < finals.length
          ? html`<button key=${i} className="final" aria-label=${'Open image ' + (i + 1)} onClick=${() => A.openViewer({fid:f.id, kind:'image', src:'deck', i})}><${Flower} k=${finals[i]}/></button>`
          : html`<span key=${i} className="final empty-slot" aria-hidden="true"></span>`)}</div>
        <div className="reelcol" data-tour=${tourKey + '-reel'}>
          ${d.reel ? html`<button className="reel" style=${{width: vd[0] + 'px', height: vd[1] + 'px'}} aria-label=${'Watch the Reel' + (d.sound ? ' with sound' : '')} onClick=${() => A.openViewer({fid:f.id, kind:'reel'}, d.sound)}>
              <${Flower} k=${d.reel.item}/><span className="playbtn" aria-hidden="true"><span style=${{width:'34px',height:'34px'}}><svg width="13" height="13" viewBox="0 0 24 24"><path d=${PLAY} fill="#FFFFFF"/></svg></span></span>
            </button>` : html`<span className="reel none" style=${{width: vd[0] + 'px', height: vd[1] + 'px'}} aria-hidden="true"></span>`}
          <span className="cap">${d.reel ? (d.sound ? 'Reel ♪' : 'Reel') : 'Reel'}</span>
        </div>
      </div>
      ${nF === 0 ? html`<p className="cap" style=${{margin:0}}>Tap ♥ on images you like. They land here.</p>` : null}
      <div className="ticks" aria-label="Against the brief">${ticks.map(tk => html`<span key=${tk.l} className=${'tick' + (tk.ok ? ' ok' : '')}><i aria-hidden="true">${tk.ok ? '✓' : ''}</i>${tk.l}${tk.opt && !tk.ok ? ' (optional)' : ''}</span>`)}</div>
      <button className="disclose" aria-expanded=${open} onClick=${() => A.togglePrice(f.id)} data-tour=${tourKey + '-price'}>Play with the price<${Icon} n="chev" s=${16}/></button>
      ${open ? html`<div className="pricebox">
        <div className="seg" role="group" aria-label="Quick presets">${Object.keys(PRESETS).map(k => { const on = f.blocks.every(b => PRESETS[k].m[b.type] === b.model); return html`<button key=${k} aria-pressed=${on} onClick=${() => A.preset(f.id, k)}>${PRESETS[k].label}</button>`; })}</div>
        ${f.blocks.map(b => {
          const t = TYPES[b.type], inf = r.info[b.id];
          const sorted = t.list.slice().sort((x, y) => MODELS[x].cr - MODELS[y].cr);
          const pos = sorted.indexOf(b.model);
          return html`<div key=${b.id} className="trade">
            <span className="n"><span>${t.title} <span className="role">${t.role}</span></span><span className="cap">${MODELS[b.model].name}</span></span>
            <span className="step"><button disabled=${pos <= 0} aria-label=${'Cheaper model for ' + t.title} onClick=${() => A.setModel(f.id, b.id, sorted[pos - 1])}>‹</button><button disabled=${pos >= sorted.length - 1} aria-label=${'Better model for ' + t.title} onClick=${() => A.setModel(f.id, b.id, sorted[pos + 1])}>›</button></span>
            <span className="c num">${inf.cost ? $(inf.cost) : 'Free'}</span>
            <span className="share" aria-hidden="true"><i style=${{width: (projAll > 0 ? Math.max(2, inf.cost / projAll * 100) : 0) + '%'}}></i></span>
          </div>`;
        })}
        ${tip ? html`<div className="tip"><span style=${{flex:1}}>${tip.text}</span>${tip.go ? html`<button className="btn" onClick=${tip.go}>${tip.label}</button>` : null}</div>` : null}
      </div>` : null}
    <//>`}
  </article>`;
}

function JarPop({S, T, $, free, A}){

  return html`<${React.Fragment}>
    <button className="clickaway" aria-label="Close" onClick=${() => A.set({jarOpen:false})}></button>
    <div className="panel-pop" role="dialog" aria-label="Credit jar" style=${{top:'calc(env(safe-area-inset-top,0px) + var(--topbar-h, 61px) + 70px)', right:'max(16px, env(safe-area-inset-right,0px))'}}>
      <h3 className="h">Credit jar</h3>
      <p className="cap" style=${{margin:0}}>One budget for the whole project. Decide once, then create.</p>

      <div className="kv"><span>Spent</span><b className="num">${$(T.spent)}</b></div>
      <div className="kv"><span>Planned in the latest flow</span><b className="num">${$(T.planned)}</b></div>
      <div className="kv"><span>${free < 0 ? 'Over budget' : 'Left'}</span><b className="num">${$(Math.abs(free))}</b></div>
      <button className="btn" onClick=${() => A.set({jarOpen:false, settingsOpen:true})}>Change budget</button>
    </div>
