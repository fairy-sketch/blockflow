}

function Picker({S, A, $, close}){
  const f = S.flows.find(x => x.id === S.picker.fid); const b = f && f.blocks.find(x => x.id === S.picker.bid);
  if (!b) return null;
  const t = TYPES[b.type]; const inf = computeFlow(f).info[b.id];
  return html`<div className="backdrop" onClick=${e => { if (e.target === e.currentTarget) close(); }}>
    <div className="sheet" role="dialog" aria-modal="true" aria-labelledby="pk-t">
      <div className="sheet-head"><h3 id="pk-t" className="h" style=${{flex:1}}>${t.title} model</h3><button className="btn btn-ghost btn-icon" aria-label="Close" onClick=${close}><${Icon} n="x" s=${17}/></button></div>
      <div className="sheet-body">
        ${t.list.map(k => { const mm = MODELS[k]; const on = b.model === k; return html`<button key=${k} className="mrow" aria-pressed=${on} onClick=${() => A.setModel(f.id, b.id, k)}>
          <span style=${{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:'2px'}}>
            <span style=${{fontWeight:600}}>${mm.name}${k === t.rec ? html`<span className="rec">Suggested</span>` : null}</span>
            <span className="cap"><span className="qdots" role="img" aria-label=${'Detail ' + mm.q + ' of 5'}>${range(5).map(i => html`<i key=${i} className=${i < mm.q ? 'on' : ''}></i>`)}</span> ${mm.tag}</span>
          </span>
          <b className="num">${mm.cr ? $(mm.cr * inf.count) : 'Free'}</b>
          <span aria-hidden="true" style=${{width:'18px'}}>${on ? '✓' : ''}</span>
        </button>`; })}
      </div>
    </div>
  </div>`;
}

function Preflight({S, A, $, T, update}){
  const f = S.flows.find(x => x.id === S.preflight.fid); const b = f && f.blocks.find(x => x.id === S.preflight.bid);
  if (!b) return null;
  const inf = computeFlow(f).info[b.id];
  const cost = inf.cost, left = S.settings.budget - T.spent - cost;
  const items = [
    b.aspect === '9:16' ? {ok:true, t:'Format 9:16 fits the brief'} : {ok:false, t:'Format is ' + b.aspect + '. The brief needs 9:16.', fix:true},
    {ok:true, t:inf.count + ' × ' + MODELS[b.model].name},
    left >= 0 ? {ok:true, t:$(left) + ' left after this'} : {ok:false, t:'This goes ' + $(-left) + ' over your budget'}
  ];
  const allOk = items.every(i => i.ok);
  const close = () => update(n => { n.preflight = null; });
  return html`<div className="backdrop" onClick=${e => { if (e.target === e.currentTarget) close(); }}>
    <div className="sheet" role="dialog" aria-modal="true" aria-labelledby="pf-t" style=${{maxWidth:'440px'}}>
      <div style=${{padding:'20px',display:'flex',flexDirection:'column',gap:'16px'}}>
        <h3 id="pf-t" className="h">Quick check before you spend <span className="num">${$(cost)}</span></h3>
        <ul className="pf">${items.map(i => html`<li key=${i.t} className=${i.ok ? '' : 'need'}>
          <span style=${{flex:'none',marginTop:'2px'}}><${Icon} n=${i.ok ? 'check' : 'warn'} s=${18} w=${2.2}/></span>
          <div style=${{display:'flex',flexDirection:'column',gap:'8px',flex:1}}><span>${i.t}</span>
            ${i.fix ? html`<button className="btn btn-primary" style=${{alignSelf:'flex-start'}} onClick=${() => A.setAspect(f.id, b.id, '9:16')}>Switch to 9:16</button>` : null}</div>
        </li>`)}</ul>
        <label style=${{display:'flex',gap:'10px',alignItems:'center',minHeight:'44px',cursor:'pointer'}}><input type="checkbox" checked=${S.dontAsk} onChange=${() => update(n => { n.dontAsk = !n.dontAsk; })} style=${{width:'20px',height:'20px',accentColor:'var(--ink)'}}/>Don't ask again</label>
        <div style=${{display:'flex',gap:'8px',flexWrap:'wrap',justifyContent:'flex-end'}}>
          <button className="btn btn-ghost" onClick=${() => update(n => { n.preflight = null; n.picker = {fid:f.id, bid:b.id}; })}>Other models</button>
          <button className="btn" onClick=${close}>Cancel</button>
          <button className=${'btn ' + (allOk ? 'btn-primary' : '')} onClick=${() => A.run(f.id, b.id, true)}>${allOk ? 'Make video' : 'Make it anyway'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function viewerSet(S, v){
  const f = S.flows.find(x => x.id === v.fid); if (!f) return null;
  if (v.src === 'block' || v.src === 'ref'){
    const b = f.blocks.find(x => x.id === v.bid); if (!b) return null;
    const t = TYPES[b.type];
    if (v.src === 'ref') return {f, b, items: b.refs.map(r => r.src ? {img:r.src} : {k:r.k}), title:'Your references', model:'', likeable:false, square:true};
    return {f, b, items: b.items.map(k => ({k})), title: t.title, model: MODELS[b.model].name, likeable: b.ran && !b.busy && (b.type === 'mood' || b.type === 'stills'), square: b.type === 'mood', upscale: b.type === 'up' ? (b.res || '4K') : ''};
  }
  const d = deckOf(f);
  return {f, b:null, items: d.finals.map(k => ({k})), title:'Campaign deck', model: d.model, likeable:false, square:false};
}
function Viewer({S, A, update}){
  const v = S.viewer;
  const [zoom, setZoom] = useState(null);
  const [before, setBefore] = useState(false);
  const set = v.kind === 'image' ? viewerSet(S, v) : null;
  const n = set ? set.items.length : 0;
  const i = n ? ((v.i % n) + n) % n : 0;
  const go = d => { setZoom(null); setBefore(false); update(x => { x.viewer.i = i + d; }); };
  const like = () => { if (set && set.likeable) A.pick(set.f.id, set.b.id, i); };
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') A.closeViewer();
      if (v.kind !== 'image') return;
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
      if ((e.key === 'l' || e.key === 'L') && set && set.likeable) like();
    };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  });
  const f = S.flows.find(x => x.id === v.fid);
  if (!f) return null;
  let stage = null, cap = '';
  if (v.kind === 'image' && n){
    const it = set.items[i];
    const liked = set.likeable && set.b.picks.indexOf(i) >= 0;
    const likes = set.likeable ? set.b.picks.length : 0;
    const onFrame = e => {
      if (zoom){ setZoom(null); return; }
      const r = e.currentTarget.getBoundingClientRect();
      setZoom({x: ((e.clientX - r.left) / r.width * 100).toFixed(1), y: ((e.clientY - r.top) / r.height * 100).toFixed(1)});
    };
    cap = set.title + ' · ' + (i + 1) + ' of ' + n + (set.model ? ' · ' + set.model : '') + (set.upscale ? ' · ' + (before ? 'before' : 'after, ' + set.upscale) : '');
    const pic = it.img ? html`<img src=${it.img} alt=${'Reference ' + (i + 1)}/>` : html`<${Flower} k=${it.k}/>`;
    stage = html`<${React.Fragment}>
      <div className="vstage">
        ${n > 1 ? html`<button className="btn btn-icon" aria-label="Previous image" onClick=${() => go(-1)}>‹</button>` : null}
        <div className=${'vframe' + (set.square ? ' sq' : '') + (zoom ? ' zoomed' : '')} role="button" tabIndex="0" aria-label=${zoom ? 'Zoom out' : 'Zoom in'} onClick=${onFrame} onKeyDown=${e => { if (e.key === 'Enter') setZoom(zoom ? null : {x:50, y:50}); }}>
          <div className=${'zin' + (before ? ' soft' : '')} style=${{transform: zoom ? 'scale(2.4)' : 'none', transformOrigin: zoom ? zoom.x + '% ' + zoom.y + '%' : '50% 50%'}}>${pic}</div>
          ${liked ? html`<span className="heart" style=${{width:'28px',height:'28px',top:'12px',right:'12px'}} aria-hidden="true"><svg viewBox="0 0 24 24" style=${{width:'15px',height:'15px'}}><path d=${HEART} fill="#1B1B1A"/></svg></span>` : null}
        </div>
        ${n > 1 ? html`<button className="btn btn-icon" aria-label="Next image" onClick=${() => go(1)}>›</button>` : null}
      </div>
      <div className="vbar">
        ${set.likeable ? html`<button className=${'btn likebtn ' + (liked ? '' : 'btn-primary')} aria-pressed=${liked} onClick=${like}><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d=${HEART} fill=${liked ? 'currentColor' : 'none'} stroke="currentColor" stroke-width="2"/></svg>${liked ? 'Liked' : 'Like'}</button>` : null}
        ${set.upscale ? html`<div className="seg" role="group" aria-label="Compare"><button aria-pressed=${before} onClick=${() => setBefore(true)}>Before</button><button aria-pressed=${!before} onClick=${() => setBefore(false)}>After · ${set.upscale}</button></div>` : null}
        <span className="cap">${zoom ? 'Tap the image to zoom out' : 'Tap the image to zoom in'}${set.likeable ? ' · ' + likes + ' ♥ so far' : ''}</span>
      </div>
      ${n > 1 ? html`<div className="strip" role="group" aria-label="All images">${set.items.map((x, j) => html`<button key=${j} aria-current=${j === i} aria-label=${'Show ' + (j + 1)} onClick=${() => { setZoom(null); update(y => { y.viewer.i = j; }); }}>
        ${x.img ? html`<img src=${x.img} alt=""/>` : html`<${Flower} k=${x.k}/>`}
        ${set.likeable && set.b.picks.indexOf(j) >= 0 ? html`<span className="heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d=${HEART} fill="#1B1B1A"/></svg></span>` : null}
      </button>`)}</div>` : null}
    <//>`;
  } else if (v.kind === 'reel'){
    const d = deckOf(f);
    if (d.reel){
      const key = 'view-' + f.id, on = S.playing === key;
      const a = d.reel.aspectRan;
      const size = a === '16:9' ? {width:'min(88vw, 900px)', aspectRatio:'16 / 9'} : (a === '1:1' ? {height:'min(64vh, 560px)', aspectRatio:'1 / 1'} : {height:'min(70vh, 640px)', aspectRatio:'9 / 16'});
      cap = 'Reel ' + a + ' · 8 s' + (d.sound ? ' · with sound' : ' · no sound yet');
      stage = html`<${React.Fragment}>
        <div className="vreel" style=${size}>
          <${Flower} k=${d.reel.item} anim=${on} drift=${on}/>
          <button className="playbtn" aria-label=${on ? 'Pause' : 'Play'} onClick=${() => A.play(key, d.sound)}><span style=${{opacity: on ? 0 : 1}}><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d=${PLAY} fill="#FFFFFF"/></svg></span></button>
        </div>
        <div className="prog" style=${{width:'min(420px, 86vw)',height:'4px'}}><i key=${on ? 'on' : 'off'} className=${on ? 'run' : ''}></i></div>
      <//>`;
    }
  }
  return html`<div className="viewer" role="dialog" aria-modal="true" aria-label=${f.name + ' · ' + cap}>
    <button className="btn btn-icon close" aria-label="Close" onClick=${A.closeViewer}><${Icon} n="x" s=${18}/></button>
    ${stage}
    <div className="cap num">${f.name} · ${cap}</div>
  </div>`;
}

function InsertMenu({S, A, close}){
  const ins = S.insert;
  const w = 248, h = 330;
  const left = Math.min(Math.max(12, ins.x - w / 2), window.innerWidth - w - 12);
  let top = ins.y + 8; if (top + h > window.innerHeight - 12) top = Math.max(12, ins.y - h - 52);
  return html`<${React.Fragment}>
    <button className="clickaway" aria-label="Close" onClick=${close}></button>
    <div className="popover" role="menu" aria-label=${'Add before ' + ins.label} style=${{left: left + 'px', top: top + 'px'}}>
      <span className="cap" style=${{padding:'6px 10px'}}>Add before ${ins.label}</span>
      ${ORDER.map(k => html`<button key=${k} role="menuitem" className="mitem" onClick=${() => A.insert(ins.fid, k, ins.at)}><span className="itile"><${Icon} n=${k} s=${16}/></span><span className="n">${TYPES[k].title}</span></button>`)}
    </div>
  <//>`;
}

function FlowMenu({S, A, close}){
  const m = S.flowMenu; const f = S.flows.find(x => x.id === m.fid); if (!f) return null;
  const voted = f.votes.indexOf('R') >= 0, kept = S.kept === f.id;
  const left = Math.min(Math.max(12, m.x - 248), window.innerWidth - 260);
  const h = 210;
  let top = m.y + 6; if (top + h > window.innerHeight - 12) top = Math.max(12, m.t - h - 6);
  return html`<${React.Fragment}>
    <button className="clickaway" aria-label="Close" onClick=${close}></button>
    <div className="popover" role="menu" aria-label=${f.name} style=${{left: left + 'px', top: top + 'px'}}>
      <button role="menuitem" className="mitem" onClick=${() => A.vote(f.id)}><span className="itile"><${Icon} n="team" s=${16}/></span><span className="n">${voted ? 'Remove my vote' : 'Vote for this flow'}</span></button>
      <button role="menuitem" className="mitem" onClick=${() => A.keep(f.id)}><span className="itile"><${Icon} n="star" s=${16} fill=${kept ? 'currentColor' : 'none'}/></span><span className="n">${kept ? 'Unpick' : 'Pick as team flow'}</span></button>
      <button role="menuitem" className="mitem" onClick=${() => A.remix(f.id)}><span className="itile"><${Icon} n="remix" s=${16}/></span><span className="n">Remix</span></button>
      <button role="menuitem" className="mitem" onClick=${() => A.deleteFlow(f.id)}><span className="itile"><${Icon} n="x" s=${16}/></span><span className="n">Delete flow</span></button>
    </div>
  <//>`;
}

function Settings({S, A, close, startTour, startQuick}){
  const st = S.settings;
  return html`<${React.Fragment}>
    <button className="clickaway" aria-label="Close" onClick=${close}></button>
    <div className="panel-pop" role="dialog" aria-label="Settings" style=${{top:'calc(env(safe-area-inset-top,0px) + var(--topbar-h, 61px) + 8px)', right:'max(16px, env(safe-area-inset-right,0px))'}}>
      <h3 className="h">Settings</h3>
      <label className="field" htmlFor="set-budget">Monthly credits
        <select id="set-budget" value=${st.budget} onChange=${e => A.setSettings({budget: +e.target.value})}>${[[5000,'5,000 (small plan)'],[15000,'15,000 (medium plan)'],[50000,'50,000 (large plan)']].map(o => html`<option key=${o[0]} value=${o[0]}>${o[1]}</option>`)}</select></label>
      <label className="field" htmlFor="set-cur">Currency
        <select id="set-cur" value=${st.currency} onChange=${e => A.setSettings({currency: e.target.value})}>${['$','€','CHF'].map(c => html`<option key=${c} value=${c}>${c}</option>`)}</select></label>
      <label className="field" htmlFor="set-rate">Price per 1,000 credits
        <input id="set-rate" type="number" min="0.5" max="5" step="0.05" value=${st.rate} onChange=${e => { const v = parseFloat(e.target.value); if (v > 0) A.setSettings({rate: v}); }}/></label>
      <div style=${{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        <button className="btn" onClick=${() => { close(); startQuick(); }}>3-step start</button>
        <button className="btn" onClick=${() => { close(); startTour(); }}>Full tour</button>
        <button className="btn btn-ghost" onClick=${() => { A.reset(); A.set({seen:[]}); close(); }}>Reset demo</button>
      </div>
    </div>
  <//>`;
}

/* ---------------- coach marks ---------------- */
function useTarget(target){
  const [rect, setRect] = useState(null);
  useEffect(() => {
    const el = document.querySelector('[data-tour="' + target + '"]');
    if (el) el.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'});
    let raf = 0;
    const loop = () => {
      const e2 = document.querySelector('[data-tour="' + target + '"]');
      if (e2){ const r = e2.getBoundingClientRect(); setRect(p => (p && Math.abs(p.top - r.top) < .5 && Math.abs(p.left - r.left) < .5 && Math.abs(p.width - r.width) < .5 && Math.abs(p.height - r.height) < .5) ? p : {top:r.top, left:r.left, width:r.width, height:r.height}); }
      else setRect(null);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return rect;
}
function Coach({target, step, total, title, body, children, onBack, onSkip, onNext, nextLabel, nextPrimary}){
  const rect = useTarget(target);
  const ref = useRef(null);
  const pad = 8, vw = window.innerWidth, vh = window.innerHeight;
  let style = {left:'16px', top:'80px'};
  if (rect){
    const cw = Math.min(340, vw - 32), ch = ref.current ? ref.current.offsetHeight : 220;
    let left = Math.min(Math.max(16, rect.left + rect.width / 2 - cw / 2), vw - cw - 16);
    let top = rect.top + rect.height + pad + 12;
    if (top + ch > vh - 16) top = rect.top - pad - 12 - ch;
    if (top < 16 || top + ch > vh - 16){
      top = Math.min(Math.max(16, rect.top), vh - ch - 16);
      if (rect.right + pad + 16 + cw < vw - 16) left = rect.right + pad + 16;
      else if (rect.left - pad - 16 - cw > 16) left = rect.left - pad - 16 - cw;
      else top = vh - ch - 16;
    }
    style = {left: left + 'px', top: Math.max(16, top) + 'px'};
  }
  return html`<${React.Fragment}>
    ${rect ? html`<div className="coach-mask" aria-hidden="true" style=${{top:(rect.top - pad) + 'px', left:(rect.left - pad) + 'px', width:(rect.width + pad * 2) + 'px', height:(rect.height + pad * 2) + 'px'}}></div>` : null}
    <div className="coach" ref=${ref} role="dialog" aria-label=${title} style=${style}>
      <span className="cap">${step} of ${total}</span>
      <h4 className="h" style=${{fontSize:'var(--fs-body)'}}>${title}</h4>
      <p>${body}</p>
      ${children}
      <div className="coach-nav">
        <div className="dots" aria-hidden="true">${range(total).map(i => html`<i key=${i} className=${i < step ? 'on' : ''}></i>`)}</div>
        ${onBack ? html`<button className="btn btn-ghost" onClick=${onBack}>Back</button>` : html`<button className="btn btn-ghost" onClick=${onSkip}>Skip</button>`}
        <button className=${'btn ' + (nextPrimary ? 'btn-primary' : '')} onClick=${onNext}>${nextLabel}</button>
      </div>
    </div>
  <//>`;
}

function QuickStart({S, A, $, startTour}){
  const step = S.qs;
  const top = S.flows[S.flows.length - 1];
  const mood = top && top.blocks.find(b => b.type === 'mood');
  const img = top && top.blocks.find(b => b.type === 'stills');
  const picks = mood ? mood.picks.length : 0;
  const imgDone = !!(img && img.ran && !img.busy);
  const end = () => A.set({qs:null});
  useEffect(() => { if (step === 1 && imgDone){ const t = setTimeout(() => A.set({qs:2}), 700); return () => clearTimeout(t); } }, [step, imgDone]);
  useEffect(() => { const k = e => { if (e.key === 'Escape' && !document.querySelector('.viewer, .backdrop, .popover, .panel-pop')) end(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  if (step === 0) return html`<${Coach} target="top-mood-tiles" step=${1} total=${3} title="Look closely, ♥ what you like" body=${picks ? picks + ' liked. Like more, or go on.' : 'Tap a flower to see it big, then tap ♥. Your ♥ decide what comes next.'}
      onSkip=${end} onNext=${() => { if (!picks && mood) A.pickMany(top.id, mood.id, [0, 5, 8]); A.set({qs:1}); }} nextLabel=${picks ? 'Next' : 'Pick for me'} nextPrimary=${picks > 0}/>`;
  if (step === 1) return html`<${Coach} target=${img ? 'top-stills-run' : 'pal-stills'} step=${2} total=${3} title=${img ? 'Press Run' : 'Add an Image'} body=${img ? (img.busy ? 'Making your images…' : 'It shows the price before it spends anything.') : 'Image turns your ♥ into finished pictures.'}
      onBack=${() => A.set({qs:0})} onNext=${() => { if (!img) A.insert(top.id, 'stills', null); else if (!img.ran && !img.busy) A.run(top.id, img.id); }} nextLabel=${img ? (img.busy ? 'Working…' : 'Run it') : 'Add it'} nextPrimary=${true}/>`;
  return html`<${Coach} target="top-deck" step=${3} total=${3} title="Your first images are ready" body="Tap one to check it big. ♥ the ones you'd publish and they land in your campaign deck."
      onBack=${() => A.set({qs:1})} onNext=${end} nextLabel="Start playing" nextPrimary=${true}>
      <button className="linkbtn" style=${{alignSelf:'flex-start'}} onClick=${startTour}>See everything in the full tour</button>
    <//>`;
}

function tourSteps(A, S){
  const top = () => S.flows[S.flows.length - 1];
  const topBlock = t => { const f = top(); return f && f.blocks.find(b => b.type === t); };
  return [
    {target:'palette', title:'Building blocks', body:'Each block does one job. Tap one to add it, or drag it onto a string.'},
    {target:'top-flow', title:'A flow', body:'Steps run left to right. Strings show what passes on. The flow ends in a campaign deck.'},
    {target:'top-mood-tiles', title:'Pick what you like', body:'Tap a flower to see it big and ♥ it. Your ♥ decide what the next step makes and costs.', action:{label:'Pick 3 for me', go:() => { const b = topBlock('mood'); if (b) A.pickMany(top().id, b.id, [0, 5, 8]); }}},
    {target:'pal-stills', after:'top-stills', title:'Add the next step', body:'Image turns your ♥ into finished pictures.', action:{label:'Add Image', go:() => { if (!topBlock('stills')) A.insert(top().id, 'stills', null); }}},
    {target:'top-stills-foot', title:'Price first', body:'3 ♥ × 2 versions × the model. Change any of them and the price updates before you spend.'},
    {target:'top-stills-run', title:'Run', body:'The only button that spends. It always shows the price first.', action:{label:'Run it', go:() => { const b = topBlock('stills'); if (b) A.run(top().id, b.id); }}},
    {target:'top-wire1', title:'Add steps anywhere', body:'Tap + on a string. A Prompt block there says exactly what you want.'},
    {target:'top-deck', title:'Campaign deck', body:'What you are making, checked against the brief.'},
    {target:'a-reel', title:'Watch it', body:'Flow A is further along. Tap its Reel to watch it with sound.'},
    {target:'a-price', title:'Play with the price', body:'Keep the main pieces strong, save on the extras like sound.', enter:() => A.togglePrice(1, true), action:{label:'Save on sound', go:() => { const f = S.flows.find(x => x.id === 1); const b = f && f.blocks.find(x => x.type === 'sound'); if (b) A.setModel(f.id, b.id, 'sfx'); }}},
    {target:'a-motion-run', title:'Quick check', body:'Before an expensive step, a short check catches wrong settings.', action:{label:'Show the check', go:() => { const f = S.flows.find(x => x.id === 1); const b = f && f.blocks.find(x => x.type === 'motion'); if (b){ A.setAspect(f.id, b.id, '16:9'); setTimeout(() => A.openPreflight(f.id, b.id), 80); } }}},
    {target:'a-remix', after:'top-flow', title:'Try another direction', body:'Remix copies a flow. The new one lands on top, so the team can compare.', action:{label:'Remix Flow A', go:() => A.remix(1)}},
    {target:'jar', title:'One budget', body:'The credit jar shows what is left for the project. Tap it for details.'},
    {target:'palette', title:'Your turn', body:'Everything works. Reset any time in settings.', last:true}
  ];
}
function Tour({S, setS, A}){
  const step = S.tour;
  const steps = tourSteps(A, S);
  const s = steps[Math.min(step, steps.length - 1)];
  const [acted, setActed] = useState(-1);
  useEffect(() => { if (s.enter) s.enter(); }, [step]);
  useEffect(() => { const k = e => { if (e.key === 'Escape' && !document.querySelector('.viewer, .backdrop, .popover, .panel-pop')) setS(p => Object.assign({}, p, {tour:null})); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  const go = d => setS(p => Object.assign({}, p, {tour: Math.max(0, Math.min(steps.length - 1, p.tour + d))}));
  const end = () => setS(p => Object.assign({}, p, {tour:null}));
  const target = (acted === step && s.after) ? s.after : s.target;
  return html`<${Coach} target=${target} step=${step + 1} total=${steps.length} title=${s.title} body=${s.body}
    onBack=${step > 0 ? () => go(-1) : null} onSkip=${end} onNext=${s.last ? end : () => go(1)} nextLabel=${s.last ? 'Start playing' : 'Next'} nextPrimary=${true}>
    ${s.action ? html`<button className="btn" style=${{alignSelf:'flex-start'}} onClick=${() => { s.action.go(); setActed(step); }}>${s.action.label}</button>` : null}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
})();
</script>
